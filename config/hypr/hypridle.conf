# Hypridle configuration
# Hypridle 0.1.8

general {
    # Lock screen
    lock_cmd = pidof hyprlock || hyprlock

    # Lock before system sleep
    before_sleep_cmd = loginctl lock-session
}

# Lock after 10 minutes of inactivity
listener {
    timeout = 600
    on-timeout = pidof hyprlock || hyprlock
}
