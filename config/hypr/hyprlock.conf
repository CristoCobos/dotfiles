# Hyprlock configuration
# Hyprlock 0.9.6

$font = Monospace

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =

    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(191923ee)

    outer_color = rgba(454560ee)
    check_color = rgba(454560ee)
    fail_color = rgba(e06c75ee)

    font_color = rgb(e0e0e8)
    font_family = $font
    font_size = 18

    fade_on_empty = false
    rounding = 12
    dots_spacing = 0.3

    placeholder_text = <i>Introduce tu contraseña...</i>
    fail_text = <i>Contraseña incorrecta</i>

    position = 0, -20
    halign = center
    valign = center
}

# Clock
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d de %B de %Y"
    font_size = 22
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}
